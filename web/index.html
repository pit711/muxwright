<header class="topbar" id="topbar">
  <a class="brand" href="#/regie" title="Regie" data-i18n-title="Regie">
    <span class="logo"><svg class="ico" viewBox="0 0 24 24"><path d="M5.6 17a8 8 0 0 1 0-10M18.4 7a8 8 0 0 1 0 10M8.5 14.5a4 4 0 0 1 0-5M15.5 9.5a4 4 0 0 1 0 5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></span>
    <span class="brand-t"><b>PlutoSDR-Regie</b><small>Studio</small></span>
  </a>

  <div class="txstatus off" id="txstatus" data-testid="tx-status" aria-live="polite">
    <span class="tx-led"></span>
    <div class="tx-main">
      <div class="tx-row"><b class="tx-state" data-testid="tx-state">AUS</b><span class="tx-sub"></span></div>
      <div class="tx-details"></div>
      <div class="tx-np" id="hdr-np" data-testid="hdr-np" hidden></div>
    </div>
  </div>

  <div class="txctl">
    <div class="seg stdswitch" role="radiogroup" aria-label="Standard" data-testid="std-switch"></div>
    <label class="switch rfswitch" title="Senden: an = Kette starten und Pluto einschalten, aus = Pluto stumm (−89,75 dB) und Kette stoppen" data-i18n-title="Senden: an = Kette starten und Pluto einschalten, aus = Pluto stumm (−89,75 dB) und Kette stoppen">
      <input type="checkbox" role="switch" data-testid="rf-enable">
      <span class="track"><i></i></span><span class="rfsw-text sw-label" data-i18n="Senden aus">Senden aus</span>
    </label>
  </div>

  <div class="chips" id="chips">
    <span class="chip-st na" data-testid="st-pluto"><svg class="ico"><use href="#i-chip"/></svg><small>Pluto</small><b>–</b></span>
    <span class="chip-st na" data-testid="st-runner"><svg class="ico"><use href="#i-server"/></svg><small data-i18n="Signalerzeugung (WSL)">Signalerzeugung (WSL)</small><b>–</b></span>
    <span class="chip-st na" data-testid="st-underruns"><svg class="ico"><use href="#i-alert"/></svg><small data-i18n="Underruns">Underruns</small><b>–</b></span>
    <span class="chip-st na" data-testid="st-rate"><svg class="ico"><use href="#i-pulse"/></svg><small data-i18n="Datenrate">Datenrate</small><b>–</b></span>
    <span class="chip-st na" data-testid="st-buffer"><svg class="ico"><use href="#i-buffer"/></svg><small data-i18n="Puffer">Puffer</small><b>–</b></span>
    <span class="chip-st na" data-testid="st-uptime" hidden><svg class="ico"><use href="#i-clock"/></svg><small data-i18n="Laufzeit">Laufzeit</small><b>–</b></span>
  </div>

  <div class="tools">
    <span class="conn bad" data-testid="conn"><i></i><span>…</span></span>
    <button type="button" class="icon-btn" data-testid="onb-open" title="Einrichtung & Rechtliches" data-i18n-title="Einrichtung &amp; Rechtliches"><svg class="ico"><use href="#i-shield"/></svg></button>
    <button type="button" class="icon-btn" data-testid="theme-toggle" title="Darstellung" data-i18n-title="Darstellung"></button>
  </div>

  <button type="button" class="estop" data-testid="estop" title="Not-Aus: Kette sofort stoppen, Pluto −89,75 dB (Strg+Leertaste)" data-i18n-title="Not-Aus: Kette sofort stoppen, Pluto −89,75 dB (Strg+Leertaste)">
    <svg class="ico"><use href="#i-power"/></svg><span data-i18n="NOT-AUS">NOT-AUS</span>
  </button>
</header>

<div class="layout">
  <nav class="sidenav" id="nav" aria-label="Bereiche"></nav>
  <main id="main" tabindex="-1"><div class="boot"><span class="spinner big"></span><p data-i18n="Verbinde mit dem Server …">Verbinde mit dem Server …</p></div></main>
</div>

<div class="applybar" id="applybar" hidden data-testid="applybar">
  <div class="ab-info">
    <svg class="ico"><use href="#i-alert"/></svg>
    <div><b class="ab-count"></b><small class="ab-kind"></small></div>
    <button type="button" class="linkbtn ab-errbtn" data-testid="apply-errors" data-i18n="Fehler anzeigen">Fehler anzeigen</button>
  </div>
  <ul class="ab-errlist"></ul>
  <div class="ab-server" hidden><span data-i18n="Serverkonfiguration hat sich geändert.">Serverkonfiguration hat sich geändert.</span> <button type="button" class="linkbtn" data-testid="apply-reload" data-i18n="Neu laden">Neu laden</button></div>
  <div class="ab-actions">
    <label class="ab-auto" title="Gültige Änderungen nach kurzer Pause selbst übernehmen, bei Bedarf mit Neustart der Kette" data-i18n-title="Gültige Änderungen nach kurzer Pause selbst übernehmen, bei Bedarf mit Neustart der Kette"><input type="checkbox" data-testid="apply-auto"> <span data-i18n="Automatisch">Automatisch</span></label>
    <button type="button" class="btn ghost" data-testid="apply-discard" data-i18n="Verwerfen">Verwerfen</button>
    <button type="button" class="btn primary" data-testid="apply"><svg class="ico"><use href="#i-check"/></svg><span data-i18n="Übernehmen">Übernehmen</span></button>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
